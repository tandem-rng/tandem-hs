name: CI

on:
  push:
  pull_request:

env:
  TANDEM_C: 4e9a69f42a3721adfd2eb87c79b6c26b92a2e62a
  TANDEM_CUDA: 5ceb466db1ea353889c1263a9d7ec36d7781a11c
  TANDEM_SPEC: ac4c4f9a690772184620a777f252669fe82bd1a5

jobs:
  vendored:
    name: vendored C and fixtures match the pinned commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out the pinned commits
        run: |
          for r in tandem-c:$TANDEM_C tandem-cuda:$TANDEM_CUDA spec:$TANDEM_SPEC; do
            git init -q "../${r%%:*}"
            git -C "../${r%%:*}" fetch -q --depth 1 "https://github.com/tandem-rng/${r%%:*}" "${r#*:}"
            git -C "../${r%%:*}" checkout -q FETCH_HEAD
          done
      - run: diff ../tandem-c/tandem.c cbits/tandem.c && diff ../tandem-c/tandem.h cbits/tandem.h
      - run: for f in tests/data/*.bin; do cmp "$f" "../tandem-c/tests/data/$(basename "$f")"; done
      - run: |
          python3 tools/gen_fixtures.py ../spec/vectors.json ../tandem-c/tests ../tandem-cuda/tests > tests/Fixtures.hs
          git diff --exit-code tests/Fixtures.hs
      - run: |
          python3 tools/gen_zig_tables.py ../spec/tables/normal_f64_zig1024.json > src/System/Random/Tandem/ZigTables.hs
          git diff --exit-code src/System/Random/Tandem/ZigTables.hs

  test:
    name: ${{ matrix.os }} GHC ${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, ghc: '9.14' }
          - { os: macos-latest, ghc: '9.14' }
          - { os: ubuntu-latest, ghc: '9.12' }
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest
      - run: cabal configure --enable-tests --enable-benchmarks && cabal build all --dry-run
      - uses: actions/cache@v6
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-
      - run: cabal build all
      - run: cabal test --test-show-details=direct
      - run: cabal build -f tools exe:tandem-dump
      - name: Dumps hash as tandem-c's
        run: |
          dump=$(cabal list-bin -f tools exe:tandem-dump)
          test "$($dump normals | shasum -a 256 | cut -d' ' -f1)" = cfae418807a7d5f91ecd3e42c33a00943690c6e4b888ee39206738783efe9ded
          test "$($dump exponentials | shasum -a 256 | cut -d' ' -f1)" = 5c035a4ef1368231d25a9c2f9201be2df3224e28a14549a50625d0db3770ef4e
      - name: Fused multiply-adds lower to instructions
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            tools/fma-asm.sh | tee plain.txt
            grep -q '^fused 0$' plain.txt && ! grep -q '^calls 0$' plain.txt
            tools/fma-asm.sh -mfma | tee fma.txt
          else
            tools/fma-asm.sh | tee fma.txt
          fi
          ! grep -q '^fused 0$' fma.txt && grep -q '^calls 0$' fma.txt
      - name: Tests with -mfma
        if: runner.os == 'Linux'
        run: cabal test -f fma --test-show-details=direct
